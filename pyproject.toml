[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "phishlens"
version = "0.1.0"
description = "Explainable classical phishing detection"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<1.8",
  "xgboost>=2.1,<4", "tldextract>=5.1,<6", "joblib>=1.4,<2",
  "shap>=0.49,<0.52",
  "dnspython>=2.6,<3", "python-whois>=0.9.5,<0.10",
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3",
  "streamlit>=1.50,<2", "httpx>=0.28,<1", "plotly>=5.24,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.11,<1"]

[project.scripts]
phishlens-train-url = "phishlens.models.train_url:main"
phishlens-train-email = "phishlens.models.train_email:main"
phishlens-prepare-email = "phishlens.models.prepare_email:main"
phishlens-prepare-url = "phishlens.models.prepare_url:main"
phishlens-collect-online = "phishlens.models.precompute_online:main"
phishlens-train-online = "phishlens.models.train_url_online:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
